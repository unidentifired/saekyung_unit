<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-label="3D vector illustration of a modern condo staycation pool">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1684e8"/><stop offset="1" stop-color="#8bd5ff"/></linearGradient>
  <linearGradient id="deck" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7d1c5"/><stop offset="1" stop-color="#aaa397"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#079fe7"/><stop offset="1" stop-color="#0755a7"/></linearGradient>
  <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff8e9"/><stop offset=".7" stop-color="#eadfc9"/><stop offset="1" stop-color="#c9bda9"/></linearGradient>
  <linearGradient id="towerSide" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c8b8a0"/><stop offset="1" stop-color="#a98f78"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".22"/></filter>
  <pattern id="tiles" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#eee9df" stroke-width="2" opacity=".65"/></pattern>
</defs>
